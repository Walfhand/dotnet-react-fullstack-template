include:
  - src/backend/docker-compose.yml

services:
  client:
    build: src/client
    environment:
      APP_API_URL: http://127.0.0.1:${API_PORT:-8080}/api/v1
    ports:
      - "127.0.0.1:${CLIENT_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
